name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # hanya dipakai untuk melampirkan APK ke Release pada tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Tes pembaca NKit di PC (image sintetis GameCube + Wii) sebelum build APK
      - name: Test NkitReader
        run: |
          python3 tools/make_test_nkit.py "$RUNNER_TEMP/t"
          mkdir -p "$RUNNER_TEMP/out"
          javac -d "$RUNNER_TEMP/out" app/src/main/java/com/nkit/extractor/NkitReader.java tools/NkitTest.java
          for k in gc wii; do
            java -cp "$RUNNER_TEMP/out" NkitTest "$RUNNER_TEMP/t/test_$k.nkit.iso" "$RUNNER_TEMP/t/out_$k"
            diff -r "$RUNNER_TEMP/t/expected_$k" "$RUNNER_TEMP/t/out_$k"
          done

      - name: Prepare signing key (hanya jika secret ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing dengan release key"
          else
            echo "Tidak ada secret signing: memakai debug key"
          fi

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp "$(find . -name 'app-release.apk' | head -n 1)" "$GITHUB_WORKSPACE/NKitExtractor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NKitExtractor-apk
          path: NKitExtractor.apk

      - name: Publish release (hanya tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NKitExtractor.apk
