name: Build APK

on:
push:
branches: [main, master]
tags: ['v*']
pull_request:
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: ubuntu-latest

steps:
  - uses: actions/checkout@v4

  - name: Find and Extract ZIP
    run: |
      set -e

      ZIP_FILES=$(find "$GITHUB_WORKSPACE" -maxdepth 3 -type f -iname "*.zip")

      ZIP_COUNT=$(echo "$ZIP_FILES" | grep -c . || true)

      if [ "$ZIP_COUNT" -ne 1 ]; then
        echo "ERROR: Harus ada tepat satu file ZIP di repository."
        echo "Ditemukan: $ZIP_COUNT"
        exit 1
      fi

      ZIP_FILE=$(echo "$ZIP_FILES" | head -n 1)

      echo "ZIP ditemukan: $ZIP_FILE"

      mkdir -p "$RUNNER_TEMP/source"

      unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/source"

      PROJECT_DIR=$(find "$RUNNER_TEMP/source" -type f -name gradlew -print -quit | xargs dirname)

      if [ -z "$PROJECT_DIR" ] || [ ! -f "$PROJECT_DIR/gradlew" ]; then
        echo "ERROR: gradlew tidak ditemukan di dalam ZIP."
        exit 1
      fi

      echo "Project ditemukan: $PROJECT_DIR"

      echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

  - uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 17

  - name: Test NkitReader
    run: |
      cd "$PROJECT_DIR"

      python3 tools/make_test_nkit.py "$RUNNER_TEMP/t"

      mkdir -p "$RUNNER_TEMP/out"

      javac -d "$RUNNER_TEMP/out" \
        app/src/main/java/com/nkit/extractor/NkitReader.java \
        tools/NkitTest.java

      for k in gc wii; do
        java -cp "$RUNNER_TEMP/out" NkitTest \
          "$RUNNER_TEMP/t/test_$k.nkit.iso" \
          "$RUNNER_TEMP/t/out_$k"

        diff -r "$RUNNER_TEMP/t/expected_$k" "$RUNNER_TEMP/t/out_$k"
      done

  - name: Prepare signing key
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    run: |
      if [ -n "$KEYSTORE_BASE64" ]; then
        echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
        echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
        echo "Signing dengan release key"
      else
        echo "Tidak ada secret signing: memakai debug key"
      fi

  - name: Build release APK
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
    run: |
      cd "$PROJECT_DIR"

      chmod +x gradlew

      ./gradlew assembleRelease --no-daemon

      cp "$(find . -name 'app-release.apk' | head -n 1)" \
        "$GITHUB_WORKSPACE/NKitExtractor.apk"

  - uses: actions/upload-artifact@v4
    with:
      name: NKitExtractor-apk
      path: NKitExtractor.apk

  - name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    uses: softprops/action-gh-release@v2
    with:
      files: NKitExtractor.apk
