name: Build APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # hanya dipakai untuk melampirkan APK ke Release saat tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Repo hanya berisi zip (belum di-extract) -> extract dulu.
      # Kalau repo sudah berisi source biasa (ada gradlew), langkah ini dilewati.
      - name: Extract zip (jika perlu)
        id: src
        run: |
          if [ -f gradlew ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            ZIP="$(find . -maxdepth 1 -iname '*.zip' | head -n 1)"
            [ -n "$ZIP" ] || { echo "Tidak ada gradlew maupun file .zip di root repo"; exit 1; }
            echo "Extract: $ZIP"
            unzip -q "$ZIP" -d "$RUNNER_TEMP/src"
            GRADLEW="$(find "$RUNNER_TEMP/src" -maxdepth 3 -name gradlew | head -n 1)"
            [ -n "$GRADLEW" ] || { echo "gradlew tidak ditemukan di dalam zip"; exit 1; }
            echo "dir=$(dirname "$GRADLEW")" >> "$GITHUB_OUTPUT"
          fi

      - name: Siapkan keystore (hanya jika secret ada)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "Signing dengan release key"
          else
            echo "Tidak ada secret signing: pakai debug key"
          fi

      - name: Build release APK
        working-directory: ${{ steps.src.outputs.dir }}
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          APK="$(find . -name 'app-release.apk' | head -n 1)"
          [ -n "$APK" ] || { echo "APK tidak ditemukan"; exit 1; }
          cp "$APK" "$GITHUB_WORKSPACE/NKitExtractor.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: NKitExtractor-apk
          path: NKitExtractor.apk

      - name: Publish release (hanya tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: NKitExtractor.apk
